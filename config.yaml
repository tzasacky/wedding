# Wedding Site Configuration
# Edit this file to customize your wedding website

couple:
  names: "Tye & Louise"

date:
  display: "09.18.2026"
  iso: "2026-09-18T16:00:00"

theme:
  primary: "#781b12"         # Deep burgundy - warm and sophisticated
  font: "Montserrat"         # Clean mountain-appropriate font

  # Light theme - warm and elegant with your colors
  text_primary: "#2c1810"    # Very dark brown for better readability than pure black
  text_secondary: "#781b12"  # Deep burgundy for secondary content
  text_muted: "#41512d"      # Deep olive for muted text
  text_light: "#ffffff"      # Pure white for light text

  # Dark theme - warm campfire / terracotta + ivory aesthetic
  dark:
    text_primary: "#F5F5F5"  # Starlight white
    text_secondary: "#EBD9C5" # Warm ivory for headings
    text_muted: "#A3A3A3"    # Muted warm gray
    text_light: "#1A1A1A"    # Dark contrast element

  # CSS variable mappings for the website
  css_vars:
    light:
      primary: "#8B4513"
      secondary: "#f3912b"
      accent: "#e5e1e3"
      text_dark: "#2c1810"
      text_secondary: "#781b12"
      text_muted: "#41512d"
      text_light: "#ffffff"
      bg_light: "#ffffff"
      bg_dark: "#e5e1e3"
      mountain_gradient: "linear-gradient(135deg, #781b12 0%, #f3912b 50%, #e5e1e3 100%)"
    dark:
      primary: "#CC9683"
      secondary: "#E0BBA9"
      accent: "#EAD7C4"
      text_dark: "#F5F5F5"
      text_secondary: "#EBD9C5"
      text_muted: "#A3A3A3"
      text_light: "#1A1A1A"
      bg_light: "#0A0A0A"
      bg_dark: "#131415"
      mountain_gradient: "linear-gradient(135deg, #0A0A0A 0%, #131415 50%, #1A1A1A 100%)"

  # Color scheme for cost indicators
  cost_colors:
    cost_1: "#22c55e"  # $ - green
    cost_2: "#eab308"  # $$ - yellow
    cost_3: "#f97316"  # $$$ - orange
    cost_4: "#ef4444"  # $$$$ - red

  # Color scheme for availability indicators
  availability_colors:
    excellent: "#22c55e"
    good: "#eab308"
    limited: "#f97316"

# Navigation sections - customize order and visibility
sections:
  - id: home
    name: "Home"
    enabled: true
    
  - id: details
    name: "Schedule"
    enabled: true
    
  - id: timeline
    name: "Our Story"
    enabled: true
    
  - id: travel
    name: "Travel"
    enabled: true
    
  - id: accommodations
    name: "Hotels"
    enabled: true

  - id: recommendations
    name: "Tips"
    title: "Recommendations"
    enabled: true

  - id: registry
    name: "Registry"
    enabled: true
    
  - id: gallery
    name: "Gallery"
    enabled: false
    
  - id: rsvp
    name: "RSVP"
    enabled: true

