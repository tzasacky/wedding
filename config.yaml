# Travel Information
travel:
  airports:
    - name: "Gunnison Airport"
      code: "GUC"
      distance_miles: 28
      drive_time: "30 minutes"
      cost_range: "$$$"
      flight_availability: "Limited"
      description: "Closest airport to Crested Butte. Flights are extremely limited, book early!"
      airlines: ["United (3 daily flights from DEN)"]
      
    - name: "Montrose Airport"
      code: "MTJ"
      distance_miles: 65
      drive_time: "1 hour 30 minutes"
      cost_range: "$$"
      flight_availability: "Good"
      description: "Scenic drive through the Black Canyon of the Gunnison National Park nearby!"
      airlines: ["United", "American", "Delta", "Alaska"]
      
    - name: "Denver Airport"
      code: "DEN"
      distance_miles: 230
      drive_time: "4 hours"
      cost_range: "$"
      flight_availability: "Excellent"
      description: "Most flight options and best prices with long but beautiful mountain drive."
      airlines: ["All major airlines"]
      
  tips_label: "Transportation in Crested Butte"
  driving_tips:
    - "We recommend using the <a href=\"https://www.mtnexp.org/schedules-routes/summer/\" target=\"_blank\" rel=\"noopener\">free Mountain Express bus</a> connecting Crested Butte downtown and Mountain Village 7:30am - Midnight"
    - "For wedding events, the free bus stops directly at <a href=\"https://maps.app.goo.gl/G3fbyjSd3ftLp59H8\" target=\"_blank\" rel=\"noopener\">Public House</a> and a 15 minute walk from the <a href=\"https://maps.app.goo.gl/e1NMgN3LpQboqMBS7\" target=\"_blank\" rel=\"noopener\">Mountain Wedding Garden</a>"
    - "Use local Uber alternative <a href=\"https://apps.apple.com/us/app/firsttracks/id6472332482\" target=\"_blank\" rel=\"noopener\">First Tracks</a> App to schedule rides from 7:15am-2:30am anywhere in the valley (<a href=\"https://www.mtnexp.org/firsttracks/\" target=\"_blank\" rel=\"noopener\">details</a>)"

