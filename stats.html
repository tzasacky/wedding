<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats for Nerds</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📊</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="scripts/theme.js"></script>
    <style>
        :root {
            --primary: #8B4513;
            --secondary: #2E8B57;
            --accent: #F5F5DC;
            --text: #2C1810;
            --bg: #FEFEFE;
            --card-bg: #F8F8F8;
            --border: #E5E5E5;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --gradient: linear-gradient(135deg, #8B4513 0%, #CD853F 50%, #D2B48C 100%);
        }

        [data-theme="dark"] {
            --text: #F8FAFC;
            --bg: #030712;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.05);
            --gradient: linear-gradient(135deg, #030712 0%, #0B1120 50%, #151F32 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
            line-height: 1.4;
            color: var(--text);
            background: var(--bg);
            padding: 1rem;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 150px;
            background: var(--gradient);
            opacity: 0.1;
            z-index: -1;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .theme-toggle:hover { transform: scale(1.1); }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;
        }

        .subtitle { opacity: 0.7; font-size: 1.125rem; margin-bottom: 1rem; }

        .performance-summary {
            display: inline-flex;
            gap: 0.75rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-top: 0.5rem;
        }

        .summary-item { text-align: center; }
        .summary-label { font-size: 0.75rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.05em; }
        .summary-value { font-weight: 600; font-size: 1.25rem; margin-top: 0.25rem; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            flex: 1;
            overflow: hidden;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--gradient);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(139, 69, 19, 0.15); }
        .stat-card:hover::before { transform: translateX(0); }

        .stat-card h3 {
            color: var(--primary);
            margin-bottom: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .card-icon { font-size: 1.5rem; }
        .metrics { flex: 1; overflow-y: auto; }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem;
            padding: 0.25rem 0;
            font-size: 0.875rem;
        }

        .metric-name { font-weight: 500; }

        .metric-value {
            font-family: 'Courier New', monospace;
            color: var(--primary);
            font-weight: bold;
            font-size: 0.8rem;
        }

        .good { color: var(--success); position: relative; }
        .good::before { content: '\25CF'; margin-right: 0.5rem; }
        .needs-improvement { color: var(--warning); position: relative; }
        .needs-improvement::before { content: '\25CF'; margin-right: 0.5rem; }
        .poor { color: var(--error); position: relative; }
        .poor::before { content: '\25CF'; margin-right: 0.5rem; }

        .back-link { text-align: center; margin-top: 2rem; }
        .back-link a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .back-link a:hover { text-decoration: underline; }
        .loading { text-align: center; padding: 2rem; opacity: 0.7; font-style: italic; }

        @media (max-width: 768px) {
            body { padding: 0.5rem; }
            h1 { font-size: 1.75rem; }
            .stats-grid { grid-template-columns: 1fr; gap: 0.75rem; }
            .performance-summary { flex-direction: column; gap: 0.25rem; padding: 0.5rem; }
            .stat-card { padding: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
            <span id="theme-icon">🌙</span>
        </button>

        <header>
            <h1>📊 Performance Analytics</h1>
            <p class="subtitle">Real-time Performance Metrics</p>
            <div class="performance-summary" id="performance-summary">
                <div class="summary-item">
                    <div class="summary-label">Overall Score</div>
                    <div class="summary-value" id="overall-score">—</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Load Time</div>
                    <div class="summary-value" id="load-time">—</div>
                </div>
            </div>
        </header>

        <div id="stats-container">
            <div class="loading">Loading performance metrics...</div>
        </div>

        <div class="back-link">
            <a href="/">&larr; Back to Wedding Site</a>
        </div>
    </div>

    <script>
        const T = {
            lcp: [2500, 4000], fcp: [1800, 3000], fid: [100, 300], inp: [200, 500],
            cls: [0.1, 0.25], ttfb: [800, 1800], tbt: [200, 600],
            load: [1000, 2000], score: [90, 75]
        };
        const stats = { vitals: {}, performance: {}, technical: {}, loaded: false };

        async function trackWebVitals() {
            try {
                const nav = performance.getEntriesByType('navigation')[0];
                if (nav && nav.responseStart) {
                    stats.performance = {
                        ttfb: Math.round(nav.responseStart - nav.navigationStart),
                        domContentLoaded: nav.domContentLoadedEventEnd ? Math.round(nav.domContentLoadedEventEnd - nav.navigationStart) : null,
                        loadComplete: nav.loadEventEnd ? Math.round(nav.loadEventEnd - nav.navigationStart) : null,
                        domInteractive: nav.domInteractive ? Math.round(nav.domInteractive - nav.navigationStart) : null,
                        domComplete: nav.domComplete ? Math.round(nav.domComplete - nav.navigationStart) : null
                    };
                    stats.vitals.ttfb = stats.performance.ttfb;
                }
            } catch (e) {}

            performance.getEntriesByType('paint').forEach(entry => {
                if (entry.name === 'first-contentful-paint') stats.vitals.fcp = Math.round(entry.startTime);
                if (entry.name === 'first-paint') stats.vitals.fp = Math.round(entry.startTime);
            });

            if ('PerformanceObserver' in window) {
                try { new PerformanceObserver((list) => { stats.vitals.lcp = Math.round(list.getEntries().at(-1).startTime); updateDisplay(); }).observe({ entryTypes: ['largest-contentful-paint'] }); } catch (e) {}
                try { new PerformanceObserver((list) => { list.getEntries().forEach(e => { stats.vitals.fid = Math.round(e.processingStart - e.startTime); updateDisplay(); }); }).observe({ entryTypes: ['first-input'] }); } catch (e) {}
                try { let maxINP = 0; new PerformanceObserver((list) => { list.getEntries().forEach(e => { if (e.processingStart) { const inp = Math.round(e.processingStart - e.startTime); if (inp > maxINP) { maxINP = inp; stats.vitals.inp = inp; updateDisplay(); } } }); }).observe({ entryTypes: ['event'] }); } catch (e) {}
                try { let clsValue = 0; new PerformanceObserver((list) => { for (const e of list.getEntries()) { if (!e.hadRecentInput) clsValue += e.value; } stats.vitals.cls = parseFloat(clsValue.toFixed(3)); updateDisplay(); }).observe({ entryTypes: ['layout-shift'] }); } catch (e) {}
                try { let longTaskCount = 0, tbt = 0; new PerformanceObserver((list) => { list.getEntries().forEach(e => { longTaskCount++; tbt += e.duration - 50; }); stats.vitals.longTasks = longTaskCount; stats.vitals.totalBlockingTime = Math.round(tbt); updateDisplay(); }).observe({ entryTypes: ['longtask'] }); } catch (e) {}
            }

            stats.technical = {
                viewport: `${window.innerWidth}\u00D7${window.innerHeight}`,
                devicePixelRatio: window.devicePixelRatio || 1,
                screen: `${screen.width}\u00D7${screen.height}`,
                colorDepth: `${screen.colorDepth}-bit`,
                colorScheme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'Dark' : 'Light'
            };

            stats.loaded = true;
            updateDisplay();

            if (document.readyState !== 'complete') {
                window.addEventListener('load', () => {
                    setTimeout(() => {
                        try {
                            const nav = performance.getEntriesByType('navigation')[0];
                            if (nav?.loadEventEnd) stats.performance.loadComplete = nav.loadEventEnd - nav.navigationStart;
                            if (nav?.domComplete) stats.performance.domComplete = nav.domComplete - nav.navigationStart;
                            updateDisplay();
                        } catch (e) {}
                    }, 100);
                });
            }
        }

        function rate(value, good, mid) { return value <= good ? 'good' : value <= mid ? 'needs-improvement' : 'poor'; }

        function updateDisplay() {
            if (!stats.loaded) return;
            const v = stats.vitals, p = stats.performance, t = stats.technical;

            document.getElementById('stats-container').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3><span class="card-icon">\uD83D\uDE80</span>Core Web Vitals</h3>
                        <div class="metrics">
                            ${v.lcp ? `<div class="metric"><span class="metric-name">LCP</span><span class="metric-value ${rate(v.lcp, ...T.lcp)}">${v.lcp}ms</span></div>` : ''}
                            ${v.fcp ? `<div class="metric"><span class="metric-name">FCP</span><span class="metric-value ${rate(v.fcp, ...T.fcp)}">${v.fcp}ms</span></div>` : ''}
                            ${v.fp ? `<div class="metric"><span class="metric-name">FP</span><span class="metric-value">${v.fp}ms</span></div>` : ''}
                            ${v.fid !== undefined ? `<div class="metric"><span class="metric-name">FID</span><span class="metric-value ${rate(v.fid, ...T.fid)}">${v.fid}ms</span></div>` : ''}
                            ${v.inp ? `<div class="metric"><span class="metric-name">INP</span><span class="metric-value ${rate(v.inp, ...T.inp)}">${v.inp}ms</span></div>` : ''}
                            ${v.cls !== undefined ? `<div class="metric"><span class="metric-name">CLS</span><span class="metric-value ${rate(v.cls, ...T.cls)}">${v.cls}</span></div>` : ''}
                            ${v.ttfb ? `<div class="metric"><span class="metric-name">TTFB</span><span class="metric-value ${rate(v.ttfb, ...T.ttfb)}">${v.ttfb}ms</span></div>` : ''}
                            ${v.totalBlockingTime !== undefined ? `<div class="metric"><span class="metric-name">TBT</span><span class="metric-value ${rate(v.totalBlockingTime, ...T.tbt)}">${v.totalBlockingTime}ms</span></div>` : ''}
                            ${v.longTasks !== undefined ? `<div class="metric"><span class="metric-name">Long Tasks</span><span class="metric-value">${v.longTasks}</span></div>` : ''}
                        </div>
                    </div>
                    <div class="stat-card">
                        <h3><span class="card-icon">\u23F1\uFE0F</span>Load Performance</h3>
                        <div class="metrics">
                            ${p.domContentLoaded ? `<div class="metric"><span class="metric-name">DOM Content Loaded</span><span class="metric-value">${p.domContentLoaded}ms</span></div>` : ''}
                            ${p.domInteractive ? `<div class="metric"><span class="metric-name">DOM Interactive</span><span class="metric-value">${p.domInteractive}ms</span></div>` : ''}
                            ${p.domComplete ? `<div class="metric"><span class="metric-name">DOM Complete</span><span class="metric-value">${p.domComplete}ms</span></div>` : ''}
                            ${p.loadComplete ? `<div class="metric"><span class="metric-name">Full Page Load</span><span class="metric-value">${p.loadComplete}ms</span></div>` : ''}
                            ${!p.domContentLoaded && !p.domInteractive ? '<div class="loading">Collecting...</div>' : ''}
                        </div>
                    </div>
                    <div class="stat-card">
                        <h3><span class="card-icon">\uD83D\uDCBB</span>Display</h3>
                        <div class="metrics">
                            <div class="metric"><span class="metric-name">Screen</span><span class="metric-value">${t.screen}</span></div>
                            <div class="metric"><span class="metric-name">Viewport</span><span class="metric-value">${t.viewport}</span></div>
                            <div class="metric"><span class="metric-name">DPR</span><span class="metric-value">${t.devicePixelRatio}x</span></div>
                            <div class="metric"><span class="metric-name">Color Depth</span><span class="metric-value">${t.colorDepth}</span></div>
                            <div class="metric"><span class="metric-name">Scheme</span><span class="metric-value">${t.colorScheme}</span></div>
                        </div>
                    </div>
                </div>
            `;

            // Update summary
            let score = 0, factors = 0;
            function scoreMetric(val, [good, mid]) { return val <= good ? 100 : val <= mid ? 75 : 50; }
            if (v.lcp) { score += scoreMetric(v.lcp, T.lcp); factors++; }
            if (v.fid !== undefined) { score += scoreMetric(v.fid, T.fid); factors++; }
            if (v.cls !== undefined) { score += scoreMetric(v.cls, T.cls); factors++; }
            if (v.ttfb) { score += scoreMetric(v.ttfb, T.ttfb); factors++; }
            const finalScore = factors > 0 ? Math.round(score / factors) : 0;
            const loadTime = p.loadComplete || 0;

            document.getElementById('overall-score').textContent = finalScore > 0 ? `${finalScore}/100` : '\u2014';
            document.getElementById('overall-score').className = `summary-value ${finalScore >= T.score[0] ? 'good' : finalScore >= T.score[1] ? 'needs-improvement' : finalScore > 0 ? 'poor' : ''}`;
            document.getElementById('load-time').textContent = loadTime > 0 ? `${loadTime}ms` : '\u2014';
            document.getElementById('load-time').className = `summary-value ${loadTime <= T.load[0] ? 'good' : loadTime <= T.load[1] ? 'needs-improvement' : loadTime > 0 ? 'poor' : ''}`;
        }

        // Load config for theme colors, then start tracking
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('./config.yaml');
                if (response.ok) {
                    const yamlText = await response.text();
                    window.siteConfig = jsyaml.load(yamlText);
                    const theme = document.documentElement.getAttribute('data-theme') || 'light';
                    if (window.applyConfigThemeVars) window.applyConfigThemeVars(theme);
                }
            } catch (e) {}

            await new Promise(resolve => setTimeout(resolve, 100));
            await trackWebVitals();
        });

        window.addEventListener('resize', () => {
            stats.technical.viewport = `${window.innerWidth}\u00D7${window.innerHeight}`;
            updateDisplay();
        });
    </script>
</body>
</html>
